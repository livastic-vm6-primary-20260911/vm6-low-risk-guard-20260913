name: VM6 taxonomy direct-merge guard
on:
  pull_request:

jobs:
  guard:
    name: vm6-taxonomy-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject combined A+B state
        shell: bash
        run: |
          set -euo pipefail
          a=no; b=no
          [[ -f area/a.txt ]] && a=yes
          [[ -f area/b.txt ]] && b=yes
          echo "A=$a B=$b"
          if [[ "$a" = yes && "$b" = yes ]]; then
            echo 'VM6_TAXONOMY_COMBINED_STATE_MUST_FAIL'
            exit 1
          fi
