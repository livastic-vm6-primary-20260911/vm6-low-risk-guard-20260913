pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
scopes:
  source:
    files:
      old-area:
        include:
          - area/**/*
      docs:
        include:
          - docs/**/*
      meta:
        include:
          - .mergify.yml
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = vm6-taxonomy-guard
    max_checks_retries: 0
    merge_method: merge
